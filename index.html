turn;list.replaceChildren();let previous="";const sorted=[...currentFilteredEntries()].sort((a,b)=>a.title.localeCompare(b.title,"el",{sensitivity:"base"}));for(const entry of sorted){const letter=normalizeGreekLetter(entry.title);if(letter!==previous){previous=letter;const heading=document.createElement("div");heading.className="letter";heading.textContent=letter;list.append(heading)}const button=document.createElement("button");button.type="button";button.className="word";button.textContent=entry.title;button.onclick=()=>navigateEntry(entry);list.append(button)}} function getFavoritesHTML(){const result=favorites.map(normalizeStoredKey).map(key=>`<button class="favorite-item" type="button" data-favorite-key="${escapeAttr(key)}">${escapeHTML(displayWordFromKey(key))}</button>`);return result.join("")||'<div class="notification-empty">Δεν έχεις αποθηκεύσει αγαπημένα.</div>'} function showHome(){currentEntryId=null;const content=qs("#content");const count=entries.length;content.innerHTML=`<div class="home"><section class="oa-hero"><div class="oa-eyebrow">ΤΟ ΛΕΞΙΚΟ ΤΟΥ TEOSTY</div><h1>Tioumpa.org<br><span class="soft">Λεξικό</span></h1><p class="oa-subhead">Αναζήτηση ${count} όρων.</p><div class="oa-command"><div class="search-wrapper"><div class="search-main"><span class="search-icon">${searchSvg}</span><input id="searchMain" type="search" aria-label="Αναζήτηση λέξης" autocomplete="off" placeholder="Αναζήτηση..." value="${escapeAttr(searchQuery)}"><button class="mic" type="button" aria-label="Φωνητική αναζήτηση" onclick="voiceSearch(event)">${micSvg}</button></div><button class="clear-btn" type="button" onclick="clearSearch()">Clean</button></div></div><div class="oa-actions"><button class="chip-btn" type="button" onclick="renderBubbles()">↻ Τυχαίες λέξεις</button><div class="favorites-wrap" id="favoritesWrap"><button class="chip-btn" type="button" id="favoritesToggle" aria-expanded="false" onclick="toggleFavorites(event)">⭐ Favorites</button><div class="favorites-bo ,String(!box.hidden))} function clearSearch(){searchQuery="";activeFilter="Όλα";dictionaryOpen=false;renderList();showHome()} function renderBubbles(){const box=qs("#bubbles");if(!box||!entries.length)return;const shuffled=[...entries].sort(()=>Math.random()-.5).slice(0,7);box.replaceChildren();for(const entry of shuffled){const button=document.createElement("button");button.type="button";button.className="bubble";button.textContent=(favorites.map(normalizeStoredKey).includes(entryKey(entry))?"⭐ ":"")+entry.title;button.onclick=()=>navigateEntry(entry);box.append(button)}} function voiceSearch(event){event?.stopPropagation();const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){alert("Το μικρόφωνο δεν υποστηρίζεται από αυτόν τον browser.");return}const recognizer=new Recognition();recognizer.lang="el-GR";recognizer.onresult=result=>{searchQuery=result.results[0][0].transcript;const input=qs("#searchMain");if(input)input.value=searchQuery;renderList();renderHomeResults()};recognizer.start()} function getEntryCleanText(entry){const lines=entry.full.split(/\r?\n/);lines.shift();return lines.join("\n").replace(/^\s*(?:Περιγραφή|Περγιφραφή)\s*:\s*/i,"").replace(/\s*\+[^+\n.,;:!?]+/g," ").trim()} function detectSynonyms(text){const match=String(text).match(/Συν:\s*([^\n.]+)/i);return match?match[1].trim():""} function detectDerivatives(title){const words={"Τιούμπα":"Τιούμπε","Ξεδίπλωμα":"ξεδιπλώνω, ξεδιπλωμένος","Χόντρεμα":"χοντραίνω","Καφεδίνκος":"καφές, καφεδάκι"};return words[title]||""} function buildMeta(entry){const rows=getEntryTypes(entry).map(type=>`<span class="meta-pill">${escapeHTML(type)}</span>`);const derivatives=detectDerivatives(entry.title);if(derivatives)rows.push(`<span class="meta-pill"><b>Παράγωγα:</b> ${escapeHTML(derivatives)}</span>`);const synonyms=detectSynonyms(entry.full);if(synonyms)rows.push(`<span class="meta-pill"><b>Συνώνυμα:</b> ${escapeHTML(synonyms)}</span>`);return rows.length?`<div class="entry-m orms[0],forms[4]],["Γενική",forms[1],forms[5]],["Αιτιατική",forms[2],forms[6]],["Κλητική",forms[3],forms[7]]];return`<div class="declension-box"><div class="declension-title">Κλίση</div><table><thead><tr><th>Πτώση</th><th>Ενικός αριθμός</th><th>Πληθυντικός αριθμός</th></tr></thead><tbody>${rows.map(row=>`<tr>${row.map(value=>`<td>${escapeHTML(value)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`} function makeExternalLink(url,label){const valid=/^(https?:\/\/)/i.test(url)?url:/^www\./i.test(url)?"https://"+url:"";if(!valid)return escapeHTML(label);return `<a class="entry-custom-link" href="${escapeAttr(valid)}" target="_blank" rel="noopener noreferrer">${escapeHTML(label)}</a>`} function applyCustomDataFormatting(text){let result=String(text);result=result.replace(/\[\[([^\]|]+)\|((?:https?:\/\/|www\.)[^\]\s]+)\]\]/gi,(match,label,url)=>makeExternalLink(url,label.trim()));result=result.replace(/((?:https?:\/\/|www\.)[^\s"'<>]+)\s*\[\[([^\]]+)\]\]/gi,(match,url,label)=>makeExternalLink(url,label.trim()));result=result.replace(/\[\[([^\]]+)\]\]\s*((?:https?:\/\/|www\.)[^\s"'<>]+)/gi,(match,label,url)=>makeExternalLink(url,label.trim()));result=result.replace(/([\p{L}\p{N}_Ά-ώϊϋΐΰ.-]+)\*bold\b/gu,"<b>$1</b>");result=result.replace(/([\p{L}\p{N}_Ά-ώϊϋΐΰ.-]+)\*italic\b/gu,"<i>$1</i>");return result} function linkReferences(text,currentTitle){const protectedParts=[];let result=String(text).replace(/<(iframe|a|b|strong|i|em|span)\b[\s\S]*?<\/\1>/gi,match=>{protectedParts.push(match);return"@@TIOUMPA_HTML_"+(protectedParts.length-1)+"@@"});const sorted=[...entries].filter(entry=>entry.title!==currentTitle&&entry.title.length>2).sort((a,b)=>b.title.length-a.title.length);const refs=[];for(const entry of sorted){const regex=new RegExp(escapeRegExp(entry.title),"gi");result=result.replace(regex,match=>{refs.push(`<button type="button" class="entry-ref" data-entry-key="${escapeAttr(entryKey(entry))}">${escapeHTML(match)}</button>`);return"@@TIOUMPA_REF_"+(refs.length
