<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Η ΣΕΛΙΔΑ ΦΤΙΑΧΝΕΤΑΙ ΤΩΡΑ... | ΛΕΞΙΚΟ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #0c0c0e;
            font-family: 'Tahoma', 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Exact Replica Text Style: White fill, Magenta stroke, Yellow shadow */
        .tahoma-stroke-text {
            font-family: 'Tahoma', 'Segoe UI', Arial, sans-serif;
            font-weight: 900;
            color: #ffffff;
            -webkit-text-stroke: 4px #ff00a0;
            text-stroke: 4px #ff00a0;
            filter: drop-shadow(5px 5px 0px #ffea00) drop-shadow(-1px -1px 0px #ffea00);
            text-transform: uppercase;
            line-height: 1.35;
            letter-spacing: 0.5px;
            paint-order: stroke fill;
        }

        /* Responsive text sizing adjustments */
        @media (max-width: 640px) {
            .tahoma-stroke-text {
                -webkit-text-stroke: 2.5px #ff00a0;
                text-stroke: 2.5px #ff00a0;
                filter: drop-shadow(3px 3px 0px #ffea00);
            }
        }

        /* Floating breathing text animation */
        @keyframes floatPulse {
            0%, 100% {
                transform: translateY(0px) scale(1);
            }
            50% {
                transform: translateY(-10px) scale(1.02);
            }
        }

        .animate-float-text {
            animation: floatPulse 3.5s ease-in-out infinite;
        }

        /* Bouncing Image Layer */
        #bouncing-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 20;
        }

        #tataros-img {
            position: absolute;
            pointer-events: auto;
            filter: drop-shadow(0 0 12px rgba(255, 0, 160, 0.4));
            will-change: transform;
        }

        /* Custom Audio Slider Styling */
        input[type=range] {
            accent-color: #ff00a0;
        }
    </style>
</head>
<body class="bg-[#0c0c0e] text-white min-h-screen flex flex-col justify-between relative overflow-hidden selection:bg-pink-600 selection:text-yellow-300">

    <!-- Subtle Radial Background Glow -->
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_center,rgba(255,0,160,0.06)_0,transparent_75%)] pointer-events-none z-0"></div>

    <!-- Bouncing Image Overlay Layer -->
    <div id="bouncing-container">
        <img id="tataros-img" 
             src="https://i.ibb.co/21mJmbzh/tataros.png" 
             alt="Tataros" 
             class="w-28 sm:w-36 md:w-44 h-auto rounded-full border-4 border-[#ff00a0] shadow-2xl"
             onerror="this.onerror=null; this.src='https://placehold.co/200x200/ff00a0/ffea00?text=TATAROS';">
    </div>

    <!-- Main Content Area: STRICTLY ONLY THE REQUESTED TEXT -->
    <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-12 max-w-6xl mx-auto text-center pointer-events-none">
        <div class="animate-float-text pointer-events-auto">
            <h1 class="tahoma-stroke-text text-3xl sm:text-5xl md:text-6xl lg:text-7xl mb-6">
                Η ΣΕΛΙΔΑ ΦΤΙΑΧΝΕΤΑΙ ΤΩΡΑ...
            </h1>
            <h2 class="tahoma-stroke-text text-2xl sm:text-4xl md:text-5xl lg:text-6xl">
                ΘΑ ΜΠΟΡΕΙΤΕ ΝΑ ΞΕΔΙΠΛΩΘΕΙΤΕ ΣΤΟ ΛΕΞΙΚΟ ΣΕ ΛΙΓΟ
            </h2>
        </div>
    </main>

    <!-- Discrete Bottom Audio Control Bar -->
    <footer class="relative z-30 w-full bg-black/70 border-t border-pink-500/20 backdrop-blur-md px-6 py-3">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-4">
            
            <!-- Play/Pause Controls -->
            <div class="flex items-center gap-3">
                <button id="play-pause-btn" aria-label="Play/Pause" class="w-10 h-10 rounded-full bg-gradient-to-r from-[#ff00a0] to-yellow-400 text-white flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition">
                    <i id="play-icon" class="fa-solid fa-play text-sm ml-0.5"></i>
                </button>
                <div class="text-xs text-gray-400 font-mono hidden sm:block">
                    <span id="curr-time">0:00</span> / <span id="dur-time">0:00</span>
                </div>
            </div>

            <!-- Volume Slider & Mute -->
            <div class="flex items-center gap-3">
                <button id="mute-btn" aria-label="Mute/Unmute" class="text-pink-400 hover:text-yellow-300 transition text-sm">
                    <i id="mute-icon" class="fa-solid fa-volume-high"></i>
                </button>
                <input id="vol-slider" type="range" min="0" max="1" step="0.01" value="0.8" class="w-24 sm:w-32 h-1.5 bg-gray-800 rounded-lg cursor-pointer">
            </div>

        </div>
    </footer>

    <!-- HTML5 Audio Element -->
    <audio id="bg-audio" loop preload="auto">
        <source src="https://media1.vocaroo.com/mp3/13aGYJiXhILJ" type="audio/mpeg">
        <source src="https://vocaroo.com/media/download_mp3/13aGYJiXhILJ" type="audio/mpeg">
    </audio>

    <script>
        // Bouncing Tataros Image Logic (VERY SLOW SPEED)
        const img = document.getElementById('tataros-img');
        let posX = Math.random() * (window.innerWidth - 180);
        let posY = Math.random() * (window.innerHeight - 180);

        // Minimal/Very Slow speed settings (0.8px per frame)
        let vx = 0.8;
        let vy = 0.8;

        function animateBounce() {
            const imgWidth = img.clientWidth || 140;
            const imgHeight = img.clientHeight || 140;
            const maxX = window.innerWidth - imgWidth;
            const maxY = window.innerHeight - imgHeight;

            posX += vx;
            posY += vy;

            if (posX <= 0) {
                posX = 0;
                vx = Math.abs(vx);
            } else if (posX >= maxX) {
                posX = maxX;
                vx = -Math.abs(vx);
            }

            if (posY <= 0) {
                posY = 0;
                vy = Math.abs(vy);
            } else if (posY >= maxX) {
                posY = maxY;
                vy = -Math.abs(vy);
            }

            img.style.transform = `translate3d(${posX}px, ${posY}px, 0px)`;
            requestAnimationFrame(animateBounce);
        }

        // Start animation loop when image loads or immediately
        img.onload = () => requestAnimationFrame(animateBounce);
        setTimeout(() => requestAnimationFrame(animateBounce), 300);

        // Audio Player Logic (No popups/modals)
        const audio = document.getElementById('bg-audio');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playIcon = document.getElementById('play-icon');
        const volSlider = document.getElementById('vol-slider');
        const muteBtn = document.getElementById('mute-btn');
        const muteIcon = document.getElementById('mute-icon');
        const currTimeLabel = document.getElementById('curr-time');
        const durTimeLabel = document.getElementById('dur-time');

        let isPlaying = false;

        function updatePlayState(playing) {
            isPlaying = playing;
            if (isPlaying) {
                playIcon.className = "fa-solid fa-pause text-sm";
            } else {
                playIcon.className = "fa-solid fa-play text-sm ml-0.5";
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    updatePlayState(true);
                }).catch(err => {
                    console.log("Play deferred:", err);
                });
            } else {
                audio.pause();
                updatePlayState(false);
            }
        }

        playPauseBtn.addEventListener('click', togglePlay);

        // Attempt immediate autoplay on load, or on first user click anywhere on screen
        function startAudioOnFirstInteraction() {
            audio.play().then(() => {
                updatePlayState(true);
            }).catch(() => {
                // If autoplay is blocked by browser policy, play on first user click anywhere
                const handleFirstClick = () => {
                    audio.play().then(() => updatePlayState(true)).catch(() => {});
                    document.removeEventListener('click', handleFirstClick);
                };
                document.addEventListener('click', handleFirstClick);
            });
        }

        window.addEventListener('load', startAudioOnFirstInteraction);

        // Volume controls
        volSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            updateMuteIcon();
        });

        let lastVolume = 0.8;
        muteBtn.addEventListener('click', () => {
            if (audio.volume > 0) {
                lastVolume = audio.volume;
                audio.volume = 0;
                volSlider.value = 0;
            } else {
                audio.volume = lastVolume || 0.8;
                volSlider.value = audio.volume;
            }
            updateMuteIcon();
        });

        function updateMuteIcon() {
            if (audio.volume === 0) {
                muteIcon.className = "fa-solid fa-volume-xmark";
            } else if (audio.volume < 0.5) {
                muteIcon.className = "fa-solid fa-volume-low";
            } else {
                muteIcon.className = "fa-solid fa-volume-high";
            }
        }

        // Time format helper
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                currTimeLabel.textContent = formatTime(audio.currentTime);
                durTimeLabel.textContent = formatTime(audio.duration);
            }
        });
    </script>
</body>
</html>
