<style>
:root{

  --bg:#070b14;

  --glass:rgba(255,255,255,.10);
  --glass-2:rgba(255,255,255,.14);
  --glass-3:rgba(255,255,255,.18);
  --glass-dark:rgba(7,11,20,.42);

  --radius-lg:24px;
  --radius-md:18px;
  --radius-sm:14px;

html[data-theme="light"]{
  color-scheme:light;
  --bg:#eef3ff;
  --bg-2:#f7fbff;
  --text:#0c1322;
  --muted:rgba(12,19,34,.66);
  --muted-2:rgba(12,19,34,.5);
  --line:rgba(12,19,34,.10);
  --line-strong:rgba(12,19,34,.14);
  --glass:rgba(255,255,255,.54);
  --glass-2:rgba(255,255,255,.72);
  --glass-3:rgba(255,255,255,.88);
  --glass-dark:rgba(255,255,255,.5);

  --shadow-soft:0 12px 40px rgba(40,62,120,.12);
  --accent:#267dff;
  --accent-2:#5ddcff;

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 20%, rgba(126,240,255,.16), transparent 24%),
    radial-gradient(circle at 85% 10%, rgba(158,203,255,.20), transparent 26%),
    radial-gradient(circle at 50% 100%, rgba(96,125,255,.18), transparent 30%),
    linear-gradient(180deg,var(--bg),var(--bg-2));
  background-attachment:fixed;
  overflow:hidden;
}
body::before,body::after{
  content:"";
  position:fixed;
  inset:auto;
  width:42vw;
  height:42vw;
  border-radius:50%;
  filter:blur(60px);
  opacity:.5;
  pointer-events:none;
  z-index:0;
  animation:floatBlob 18s ease-in-out infinite;
}
body::before{left:-10vw;top:-12vw;background:radial-gradient(circle, rgba(126,240,255,.22), transparent 60%)}
body::after{right:-8vw;bottom:-14vw;background:radial-gradient(circle, rgba(158,203,255,.24), transparent 60%);animation-delay:-9s}
@keyframes floatBlob{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3vw,-2vw,0) scale(1.08)}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.12));border-radius:999px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.header,.sidebar,.content,.left-ad,.filter-box,.search-main input,.search-wrapper select,.search-wrapper button,.word,.bubble,.meta-pill,.back-btn,.home-results,.home-result-item,.home-toggle-section button,.mobile-dictionary-toggle,.theme-simple,.lang-simple,.theme-simple-btn,.lang-simple-btn,.declension-box,.social,.entry-images img,.entry-body iframe{
  position:relative;
  z-index:1;
}
.header{
  height:78px;
  display:flex;
  align-items:center;
  gap:16px;
  padding:14px 18px;
  margin:14px;
  border:1px solid var(--line);
  border-radius:28px;
  background:linear-gradient(180deg,var(--glass-2),var(--glass));
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  box-shadow:var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,.28);
  cursor:pointer;
}
.header::before,.sidebar::before,.left-ad::before,.filter-box::before,.entry::before,.home-results::before,.declension-box::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  padding:1px;
  background:linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,.06) 35%, rgba(255,255,255,.18) 70%, rgba(255,255,255,.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}
.header img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(0,0,0,.22))}
.header strong{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.04em;
}
.theme-control,.lang-control{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang-control{margin-left:0}
.theme-control label,.lang-control label,.filter-title,.subtitle,.email,.random-title,.home-results-title{color:var(--muted)}
.theme-simple,.lang-simple{
  display:inline-flex;
  gap:4px;
  padding:4px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(16px);
}
.theme-simple-btn,.lang-simple-btn,.filter-btn,.theme-control select,.lang-control select{
  border:0;
  background:transparent;
  color:var(--muted);
  height:34px;
  padding:0 14px;
  border-radius:999px;
  font:700 12px/1 "Manrope","Helvetica Neue",sans-serif;
  letter-spacing:.01em;
  cursor:pointer;
  transition:.3s ease;
}
.theme-simple-btn:hover,.lang-simple-btn:hover,.filter-btn:hover,.filter-toggle:hover,.word:hover,.bubble:hover,.home-result-item:hover,.home-toggle-section button:hover,.mobile-dictionary-toggle:hover,.back-btn:hover,.social:hover{
  transform:translateY(-1px) scale(1.01);
}
.theme-simple-btn.active,.lang-simple-btn.active,.filter-btn.active{
  color:var(--text);
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 8px 20px rgba(0,0,0,.16);
}
.app{display:flex;height:calc(100vh - 106px);padding:0 14px 14px;gap:14px;position:relative;z-index:1}
.left-ad,.sidebar,.content{
  border:1px solid var(--line);
  border-radius:32px;
  background:linear-gradient(180deg,var(--glass-2),var(--glass-dark));
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.18);
}
.left-ad{width:190px;min-width:190px;padding:18px 12px;overflow:hidden}
.left-ad-box{position:sticky;top:18px;width:100%;min-height:300px}
.content{flex:1;padding:34px;overflow:auto}
.sidebar{width:390px;min-width:280px;max-width:640px;padding:18px;overflow:auto}
.resizer{
  width:12px;
  align-self:stretch;
  cursor:col-resize;
  position:relative;
  opacity:.7;
}
.resizer::before{
  content:"";
  position:absolute;
  inset:18px 2px;
  border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.32),rgba(255,255,255,.04));
  box-shadow:0 0 0 1px rgba(255,255,255,.06), inset 0 1px 0 rgba(255,255,255,.18);
}
.filter-box{
  position:sticky;
  top:0;
  margin-bottom:14px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:26px;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.08));
  backdrop-filter:blur(24px);
  max-height:620px;
  overflow:hidden;
  transition:.35s ease;
}
.filter-box.collapsed{max-height:72px}
.filter-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.filter-title{font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.filter-toggle{
  width:34px;height:34px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.08);color:var(--text);cursor:pointer
}
.filters{display:flex;flex-wrap:wrap;gap:8px;transition:.3s ease}
.filter-box.collapsed .filters{max-height:34px;overflow:hidden}
.filter-btn{
  height:auto;
  min-height:36px;
  padding:8px 14px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.08);
  color:var(--text);
}
.letter{
  margin:20px 4px 10px;
  padding-bottom:8px;
  font-size:13px;
  font-weight:800;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--muted);
  border-bottom:1px solid var(--line);
}
.word{
  padding:12px 14px;
  border:1px solid transparent;
  border-radius:18px;
  transition:.25s ease;
}
.word:hover{background:rgba(255,255,255,.08);border-color:var(--line)}
.home,.entry{
  min-height:100%;
  border:1px solid var(--line);
  border-radius:34px;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.06));
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:var(--shadow);
}
.home{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:48px 28px;
  animation:fadeIn .45s ease;
}
.home-logo{
  width:180px;height:180px;object-fit:contain;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.28));
  animation:logoFloat 8s ease-in-out infinite;
}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
.home h1,.entry-title{
  margin:18px 0 8px;
  font-size:clamp(32px,5vw,52px);
  line-height:1.02;
  letter-spacing:-.055em;
  font-weight:800;
}
.subtitle{font-size:12px;letter-spacing:.28em;text-transform:uppercase}
.email{margin-top:10px;max-width:780px;font-size:13px;line-height:1.6}
.search-copy{margin-top:22px;font-size:15px;color:var(--text)}
.search-wrapper{
  position:relative;
  margin-top:24px;
  width:min(840px,96%);
  display:grid;
  grid-template-columns:minmax(0,1fr) 180px 132px;
  gap:10px;
  align-items:center;
}
.search-main{position:relative}
.search-main input,.search-wrapper select,.search-wrapper button,.home-toggle-section button,.mobile-dictionary-toggle,.back-btn,.social{
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.08));
  color:var(--text);
  border-radius:20px;
  backdrop-filter:blur(18px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 12px 30px rgba(0,0,0,.18);
}
.search-main input{
  width:100%;
  padding:18px 54px;
  font:700 16px/1.2 "Manrope","Helvetica Neue",sans-serif;
  outline:none;
  transition:.3s ease;
}
.search-main input::placeholder{color:var(--muted)}
.search-main input:focus{
  border-color:rgba(158,203,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 0 4px rgba(158,203,255,.12),0 24px 50px rgba(0,0,0,.24);
  transform:translateY(-1px);
}
.search-icon,.mic-img{position:absolute;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.82}
.search-icon{left:18px;filter:brightness(0) invert(1)}
.mic{position:absolute;right:18px;top:50%;transform:translateY(-50%);cursor:pointer}
.search-wrapper select,.search-wrapper button,.mobile-dictionary-toggle{height:56px;padding:0 16px;font:800 13px/1 "Manrope","Helvetica Neue",sans-serif}
.home-toggle-section{margin-top:20px}
.home-toggle-section button{padding:12px 18px}
.hidden-box{max-height:0;opacity:0;overflow:hidden;transition:.35s ease}
.hidden-box.open{max-height:260px;opacity:1;margin-top:12px}
.home-list-item{cursor:pointer;padding:8px 10px;border-radius:12px}

.random-title{margin-top:36px;font-size:11px;letter-spacing:.24em;text-transform:uppercase}

  border:1px solid var(--line);
  border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 18px 36px rgba(0,0,0,.18);
  cursor:pointer;
  animation:glassPulse 7s ease-in-out infinite;
}
.bubble:nth-child(2n){animation-delay:-1.5s}
.bubble:nth-child(3n){animation-delay:-3s}
@keyframes glassPulse{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.02)}}
.home-results{
  display:none;
  width:min(840px,96%);
  margin-top:14px;
  text-align:left;
  border:1px solid var(--line);
  border-radius:24px;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.08));
  overflow:hidden;
  backdrop-filter:blur(20px);
}
.home-results.open{display:block;animation:fadeIn .25s ease}
.home-results-title{padding:12px 16px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.home-result-item{padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--line);transition:.25s ease}

.entry{padding:28px 28px 34px;animation:fadeIn .35s ease}

.entry-meta{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
.meta-pill{

  border:1px solid var(--line);
  border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
}
.entry-body{
  white-space:pre-wrap;
  line-height:1.78;
  font-size:17px;
  color:var(--text);
}
.entry-ref,.entry-custom-link{color:var(--accent);text-decoration:none}
.entry-ref:hover,.entry-custom-link:hover{text-decoration:underline}
.entry-images{display:flex;flex-direction:column;align-items:flex-end;gap:14px;margin-top:26px}
.entry-images img{

  border-radius:24px;
  border:1px solid var(--line);
  box-shadow:var(--shadow-soft);
}
.entry-body iframe{display:block;margin-top:30px;max-width:760px;width:100%;aspect-ratio:16/9;height:auto;border:1px solid var(--line);border-radius:24px}
.declension-box{
  margin-top:24px;
  margin-left:auto;
  width:fit-content;
  max-width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:22px;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.06));
}
.declension-title{font-weight:800;margin-bottom:12px;color:var(--accent)}
.declension-box table{width:100%;border-collapse:collapse;font-size:14px}
.declension-box th,.declension-box td{border:1px solid var(--line);padding:8px 10px;text-align:center;white-space:nowrap}
.back-btn{
  position:sticky;
  top:0;
  float:right;
  height:48px;
  padding:0 16px;
  cursor:pointer;
  z-index:4;
}
.socials{display:flex;gap:12px;margin-top:20px;justify-content:center;flex-wrap:wrap}
.social{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:700;transition:.25s ease}
.entry-small-notes{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;line-height:1.6;color:var(--muted)}
.entry-ad-wrap{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);width:100%;max-width:728px;min-height:90px}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media (max-width:1100px){
  .search-wrapper{grid-template-columns:1fr}
  .left-ad{display:none}
}
@media (max-width:850px){
  body{overflow:auto}
  .header{height:auto;flex-wrap:wrap}
  .theme-control{margin-left:0}
  .app{flex-direction:column;height:auto}
  .resizer{display:none}
  .sidebar{display:none;width:100%!important;min-width:0;max-width:none;max-height:340px}
  .content{padding:0}
  .home,.entry{padding:24px 18px}
  .home{justify-content:flex-start}
  .home-logo{width:130px;height:130px}
  .home h1,.entry-title{font-size:clamp(28px,9vw,40px)}
  .home-results{display:block;width:100%}
  .home-results:not(.open){display:none}
  .mobile-dictionary-toggle{display:block;width:100%;margin-top:12px}
  .entry-images img{max-width:100%;width:100%}
  .declension-box{width:100%;margin-left:0;overflow:auto}
}
@media (min-width:851px){.mobile-dictionary-toggle{display:none}}
